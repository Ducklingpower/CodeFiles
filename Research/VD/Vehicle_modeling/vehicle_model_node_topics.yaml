# merge_rosbag2_folder_to_csv_v3.py --topics-file for the recorded vehicle_model node outputs
# field names = the proposed BicycleState / BicycleDebug / DualTrackState / DualTrackDebug messages
# (observer_block_diagrams.html "Proposed output messages"); change both here and in compare_vehicle_model_node.m
# if the messages change. Per axle arrays are [front, rear], per tire arrays [FL, FR, RL, RR].

/control/vehicle_model/bicycle/state:
  bike_delta: delta
  bike_vy_obs: vy_obs
  bike_k_us: k_us
  bike_slip_angle_kin_f: slip_angle_kin[0]
  bike_slip_angle_kin_r: slip_angle_kin[1]
  bike_slip_angle_obs_f: slip_angle_obs[0]
  bike_slip_angle_obs_r: slip_angle_obs[1]
  bike_slip_ratio_f: slip_ratio[0]
  bike_slip_ratio_r: slip_ratio[1]
  bike_fz_model_f: fz_model[0]
  bike_fz_model_r: fz_model[1]
  bike_fz_obs_f: fz_obs[0]
  bike_fz_obs_r: fz_obs[1]
  bike_fx_f: fx[0]
  bike_fx_r: fx[1]
  bike_fy_f: fy[0]
  bike_fy_r: fy[1]

/control/vehicle_model/bicycle/debug:
  bikedbg_moving: moving
  bikedbg_slip_angle_valid: slip_angle_valid
  bikedbg_observer_running: observer_running
  bikedbg_fz_observer_active: fz_observer_active
  bikedbg_k_us_valid: k_us_valid
  bikedbg_vy_tire_model: vy_tire_model
  bikedbg_slip_ratio_valid_f: slip_ratio_valid[0]
  bikedbg_slip_ratio_valid_r: slip_ratio_valid[1]
  bikedbg_brush_slip_f: brush_slip[0]
  bikedbg_brush_slip_r: brush_slip[1]
  bikedbg_conditioning_f: conditioning[0]
  bikedbg_conditioning_r: conditioning[1]
  bikedbg_saturated_f: saturated[0]
  bikedbg_saturated_r: saturated[1]

/control/vehicle_model/dualtrack/state:
  dual_vy_obs: vy_obs
  dual_k_us: k_us
  dual_delta_fl: delta[0]
  dual_delta_fr: delta[1]
  dual_delta_rl: delta[2]
  dual_delta_rr: delta[3]
  dual_slip_angle_kin_fl: slip_angle_kin[0]
  dual_slip_angle_kin_fr: slip_angle_kin[1]
  dual_slip_angle_kin_rl: slip_angle_kin[2]
  dual_slip_angle_kin_rr: slip_angle_kin[3]
  dual_slip_angle_obs_fl: slip_angle_obs[0]
  dual_slip_angle_obs_fr: slip_angle_obs[1]
  dual_slip_angle_obs_rl: slip_angle_obs[2]
  dual_slip_angle_obs_rr: slip_angle_obs[3]
  dual_kappa_fl: kappa[0]
  dual_kappa_fr: kappa[1]
  dual_kappa_rl: kappa[2]
  dual_kappa_rr: kappa[3]
  dual_slip_ratio_x_fl: slip_ratio_x[0]
  dual_slip_ratio_x_fr: slip_ratio_x[1]
  dual_slip_ratio_x_rl: slip_ratio_x[2]
  dual_slip_ratio_x_rr: slip_ratio_x[3]
  dual_slip_ratio_y_fl: slip_ratio_y[0]
  dual_slip_ratio_y_fr: slip_ratio_y[1]
  dual_slip_ratio_y_rl: slip_ratio_y[2]
  dual_slip_ratio_y_rr: slip_ratio_y[3]
  dual_fz_model_fl: fz_model[0]
