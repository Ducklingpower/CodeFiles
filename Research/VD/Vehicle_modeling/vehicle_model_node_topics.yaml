  dual_fz_obs_rr: fz_obs[3]
  dual_fx_fl: fx[0]
  dual_fx_fr: fx[1]
  dual_fx_rl: fx[2]
  dual_fx_rr: fx[3]
  dual_fy_load_split_fl: fy_load_split[0]
  dual_fy_load_split_fr: fy_load_split[1]
  dual_fy_load_split_rl: fy_load_split[2]
  dual_fy_load_split_rr: fy_load_split[3]
  dual_fy_corrected_fl: fy_corrected[0]
  dual_fy_corrected_fr: fy_corrected[1]
  dual_fy_corrected_rl: fy_corrected[2]
  dual_fy_corrected_rr: fy_corrected[3]

/control/vehicle_model/dualtrack/debug:
