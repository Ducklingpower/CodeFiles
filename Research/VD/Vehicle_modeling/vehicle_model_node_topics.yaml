# merge_rosbag2_folder_to_csv_v3.py --topics-file for the recorded vehicle_model node outputs
# field names = the proposed BicycleState / BicycleDebug / DualTrackState / DualTrackDebug messages
# (observer_block_diagrams.html "Proposed output messages"); change both here and in compare_vehicle_model_node.m
# if the messages change. Per axle values are nested messages (alpha_front, alpha_rear, ...), per tire values
# nested messages (alpha_fl, alpha_fr, alpha_rl, alpha_rr, ...).

/control/vehicle_model/bicycle/state:
  bike_delta: delta
  bike_vy_obs: vy_hat
  bike_k_us: k_us
  bike_slip_angle_kin_f: slip_angle_kin.alpha_front
  bike_slip_angle_kin_r: slip_angle_kin.alpha_rear
  bike_slip_angle_obs_f: slip_angle_hat.alpha_front
  bike_slip_angle_obs_r: slip_angle_hat.alpha_rear
  bike_slip_ratio_f: slip_ratio.sx_front
  bike_slip_ratio_r: slip_ratio.sx_rear
  bike_fz_model_f: fz_model.fz_front
  bike_fz_model_r: fz_model.fz_rear
  bike_fz_obs_f: fz_hat.fz_front
  bike_fz_obs_r: fz_hat.fz_rear
  bike_fx_f: fx.fx_front
  bike_fx_r: fx.fx_rear
  bike_fy_f: fy.fy_front
  bike_fy_r: fy.fy_rear

/control/vehicle_model/bicycle/debug:
  bikedbg_moving: moving
  bikedbg_slip_angle_valid: slip_angle_valid
  bikedbg_observer_running: observer_running
  bikedbg_fz_observer_active: fz_observer_active
  bikedbg_k_us_valid: k_us_valid
  bikedbg_vy_tire_model: vy_tire_model
  bikedbg_slip_ratio_valid_f: slip_ratio_valid.sx_valid_front
  bikedbg_slip_ratio_valid_r: slip_ratio_valid.sx_valid_rear
  bikedbg_brush_slip_f: brush_slip.alpha_front
  bikedbg_brush_slip_r: brush_slip.alpha_rear
  bikedbg_conditioning_f: conditioning.conditioning_front
  bikedbg_conditioning_r: conditioning.conditioning_rear
  bikedbg_saturated_f: saturated.saturated_front
  bikedbg_saturated_r: saturated.saturated_rear

/control/vehicle_model/dualtrack/state:
  dual_vy_obs: vy_hat
  dual_k_us: k_us
  dual_delta_fl: delta.delta_fl
