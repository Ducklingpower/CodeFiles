  dual_fz_obs_rl: fz_hat.fz_rl
  dual_fz_obs_rr: fz_hat.fz_rr
  dual_fx_fl: fx.fx_fl
  dual_fx_fr: fx.fx_fr
  dual_fx_rl: fx.fx_rl
