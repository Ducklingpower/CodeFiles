  dual_slip_ratio_x_fr: slip_ratio_x.sx_fr
  dual_slip_ratio_x_rl: slip_ratio_x.sx_rl
  dual_slip_ratio_x_rr: slip_ratio_x.sx_rr
  dual_slip_ratio_y_fl: slip_ratio_y.sy_fl
