# merge_rosbag2_folder_to_csv_v3.py --topics-file for the C1 oscillation study (sim k_us runs): sim_kus_topics.yaml
# plus brakes, throttle, wheel speeds, slip ratios, tire forces, vertical motion and the vehicle model flags

/control/fbl_mpc/debug_understeer_source:
  kus_used: data[0]
  kus_src: data[1]
  kus_mpc: data[2]
  kus_bike: data[3]
  kus_dual: data[4]
/control/fbl_mpc/mpc_debug_lateral_error:
  lat_err: data[0]
/control/fbl_mpc/mpc_debug_lateral_error_vel:
